<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#162466" />
    <title>Padova Life SIM</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231d2f7a%22/%3E%3Cpath d=%22M16 4l2.6 7.7 7.8-1.5-5.3 5.8 5.3 5.8-7.8-1.5L16 28l-2.6-7.7-7.8 1.5 5.3-5.8-5.3-5.8 7.8 1.5z%22 fill=%22%23f2c14e%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game" aria-label="Game view"></div>

    <div id="hud" class="hud">
      <div id="status" class="pill" role="status" aria-live="polite">Not connected</div>
      <div id="players" class="pill" aria-live="polite"></div>
    </div>

    <div class="hud hud-right">
      <button id="me-chip" class="pill me-chip" type="button" hidden></button>
    </div>

    <div id="toast" class="toast" role="alert" hidden></div>

    <div id="joystick" class="joystick" hidden aria-label="Movement joystick">
      <div class="joystick-knob"></div>
    </div>

    <div id="help" class="help">
      <span class="help-desktop">Click the ground to walk · click people and objects for actions · click yourself for your character · WASD to move · drag to turn · wheel to zoom</span>
      <span class="help-touch">Tap to walk · tap people and objects for actions · drag to turn · pinch to zoom</span>
    </div>

    <div id="screens" class="screens" aria-live="off"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
