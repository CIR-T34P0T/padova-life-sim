<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character lab · Padova Life SIM</title>
    <style>
      body { margin: 0; font: 13px/1.35 system-ui, sans-serif; background: #e9dfd1; color: #2a2220; }
      header { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
      header h1 { font-size: 16px; margin: 0; }
      header a { color: #8a3b25; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 190px), 1fr)); gap: 6px; padding: 0 10px 10px; }
      .cell { background: #f4eee6; border-radius: 8px; overflow: hidden; }
      .cell .view { aspect-ratio: var(--ratio, 0.62); }
      .cell .label { padding: 4px 8px 6px; }
      .cell .label b { display: block; }
      .cell .label small { color: #6b5a50; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #summary { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <header>
      <h1>Character lab</h1>
      <span>Developer page: every preset and option, with build cost. Not part of the game.</span>
      <a href="?grid">Presets</a><a href="?grid&view=face">Faces</a><a href="?options=hair">Hair</a><a href="?options=outfit">Outfits</a><a href="?options=skin">Skin tones</a><a href="?options=face">Face shapes</a><a href="?options=pose">Poses</a>
      <span id="summary"></span>
    </header>
    <div id="grid"></div>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
